<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍞 띠용 GIF 오븐 V2</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; background: #ffeaa7; text-align: center; padding: 40px 20px; margin: 0; }
    .oven { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
    
    /* 원형 디스플레이 느낌을 내는 미리보기 캔버스 */
    canvas { background: #333; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-top: 20px; }
    
    /* 편집 컨트롤 패널 */
    .controls { display: none; background: #f8f9fa; padding: 20px; border-radius: 16px; margin-top: 20px; text-align: left; }
    .control-group { margin-bottom: 15px; }
    .control-group label { display: flex; justify-content: space-between; font-weight: bold; color: #2d3436; font-size: 14px; margin-bottom: 5px; }
    input[type="range"] { width: 100%; cursor: pointer; }
    
    button { background: #fd79a8; color: white; border: none; padding: 16px 32px; font-size: 18px; border-radius: 12px; cursor: pointer; margin-top: 20px; font-weight: bold; transition: 0.2s; width: 100%; }
    button:hover { background: #e84393; transform: scale(1.02); }
    button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    input[type="file"] { margin: 10px 0; padding: 10px; background: #f1f2f6; border-radius: 8px; width: 90%; }
    
    #resultImg { display: none; margin-top: 20px; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.4); background: black; }
  </style>
</head>
<body>
  <div class="oven">
    <h2>🍞 띠용 GIF 오븐 V2</h2>
    <p style="color:#636e72; line-height:1.5; font-size: 14px;">사진을 넣고 <b>위치와 크기</b>를 조절해보세요.<br>ESP32 원형 화면에 딱 맞게 구워드립니다!</p>
    
    <input type="file" id="upload" accept="image/*">
    
    <canvas id="previewCanvas" width="240" height="240" style="display:none;"></canvas>

    <div class="controls" id="controlsPanel">
      <div class="control-group">
        <label>🔍 크기 조절 <span id="zoomVal">1.0x</span></label>
        <input type="range" id="zoom" min="0.1" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="control-group">
        <label>↔️ 좌우 위치 (X) <span id="xVal">0</span></label>
        <input type="range" id="offsetX" min="-500" max="500" step="5" value="0">
      </div>
      <div class="control-group">
        <label>↕️ 상하 위치 (Y) <span id="yVal">0</span></label>
        <input type="range" id="offsetY" min="-500" max="500" step="5" value="0">
      </div>
    </div>
    
    <button id="bakeBtn" style="display:none;" onclick="bakeGIF()">🔥 이대로 GIF 굽기!</button>
    
    <img id="resultImg" width="240" height="240">
    <p id="status" style="color: #d63031; font-weight: bold; margin-top: 20px;"></p>
  </div>

  <script>
    let loadedImage = new Image();
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI 요소들
    const controlsPanel = document.getElementById('controlsPanel');
    const zoomSlider = document.getElementById('zoom');
    const xSlider = document.getElementById('offsetX');
    const ySlider = document.getElementById('offsetY');

    // 1. 이미지 파일 업로드 감지
    document.getElementById('upload').addEventListener('change', function(e) {
      let file = e.target.files[0];
      if(!file) return;
      let reader = new FileReader();
      reader.onload = function(event) {
        loadedImage.src = event.target.result;
        loadedImage.onload = () => {
          // 초기 설정 리셋
          zoomSlider.value = 1.0; xSlider.value = 0; ySlider.value = 0;
          
          // 슬라이더 범위 자동 최적화 (이미지 크기에 비례하게)
          const maxOffset = Math.max(loadedImage.width, loadedImage.height);
          xSlider.min = -maxOffset; xSlider.max = maxOffset;
          ySlider.min = -maxOffset; ySlider.max = maxOffset;

          canvas.style.display = 'inline-block';
          controlsPanel.style.display = 'block';
          document.getElementById('bakeBtn').style.display = 'inline-block';
          document.getElementById('resultImg').style.display = 'none';
          document.getElementById('status').innerText = '원형 화면에 꽉 차게 잘 조절해주세요!';
          
          updatePreview();
        }
      }
      reader.readAsDataURL(file);
    });

    // 2. 슬라이더 움직일 때마다 실시간 미리보기 업데이트
    function updatePreview() {
      const zoom = parseFloat(zoomSlider.value);
      const x = parseFloat(xSlider.value);
      const y = parseFloat(ySlider.value);

      // 숫자 라벨 업데이트
      document.getElementById('zoomVal').innerText = zoom.toFixed(1) + 'x';
      document.getElementById('xVal').innerText = x;
      document.getElementById('yVal').innerText = y;

      // 캔버스 초기화 및 배경
      ctx.clearRect(0, 0, 240, 240);
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, 240, 240);

      ctx.save();
      // 동그란 마스크 씌우기 (원형 디스플레이 시뮬레이션)
      ctx.beginPath();
      ctx.arc(120, 120, 120, 0, Math.PI * 2);
      ctx.clip();

      // 사용자 설정값(위치, 크기) 적용
      ctx.translate(120 + x, 120 + y); // 중심 이동 + 사용자 X/Y 이동
      ctx.scale(zoom, zoom); // 사용자 확대/축소
      
      // 이미지를 중앙을 기점으로 그리기
      ctx.drawImage(loadedImage, -loadedImage.width / 2, -loadedImage.height / 2);
      ctx.restore();
    }

    // 슬라이더 이벤트 리스너 달기
    zoomSlider.addEventListener('input', updatePreview);
    xSlider.addEventListener('input', updatePreview);
    ySlider.addEventListener('input', updatePreview);

    // 3. GIF 굽기 로직
    function bakeGIF() {
      document.getElementById('status').innerText = '🔥 오븐 가열 중... (반죽 찌부시키는 중)';
      document.getElementById('bakeBtn').disabled = true;

      const zoom = parseFloat(zoomSlider.value);
      const offsetX = parseFloat(xSlider.value);
      const offsetY = parseFloat(ySlider.value);
      const frames = [];
      
      // 쫀득한 애니메이션 스케일 (가로 비율, 세로 비율)
      const scales = [
        [1.0, 1.0],   // 0: 기본
        [1.1, 0.8],   // 1: 살짝 눌림
        [1.25, 0.6],  // 2: 최대치 찌부 (ESP32 정지 프레임)
        [0.9, 1.1],   // 3: 용수철 튀어오름
        [1.0, 1.0]    // 4: 원상복구
      ];

      scales.forEach(scale => {
        let tempCanvas = document.createElement('canvas');
        tempCanvas.width = 240; tempCanvas.height = 240;
        let tCtx = tempCanvas.getContext('2d');
        
        tCtx.fillStyle = "black";
        tCtx.fillRect(0, 0, 240, 240);

        tCtx.save();
        // 1) 화면 정중앙으로 기준점 이동
        tCtx.translate(120, 120);
        // 2) 띠용 애니메이션(찌부) 효과 먼저 적용
        tCtx.scale(scale[0], scale[1]);
        // 3) 사용자가 설정한 위치와 크기 적용
        tCtx.translate(offsetX, offsetY);
        tCtx.scale(zoom, zoom);
        
        tCtx.drawImage(loadedImage, -loadedImage.width / 2, -loadedImage.height / 2);
        tCtx.restore();
        
        frames.push(tempCanvas.toDataURL("image/jpeg", 0.9)); 
      });

      gifshot.createGIF({
        images: frames, gifWidth: 240, gifHeight: 240,
        interval: 0.05, sampleInterval: 10
      }, function(obj) {
        if(!obj.error) {
          document.getElementById('resultImg').src = obj.image;
          document.getElementById('resultImg').style.display = 'inline-block';
          canvas.style.display = 'none'; // 굽기 끝나면 캔버스 숨기고 결과물 표시
          controlsPanel.style.display = 'none';
          document.getElementById('status').innerText = '✨ 짠! 완벽한 비율의 GIF가 구워졌습니다!';
          document.getElementById('bakeBtn').disabled = false;
          
          let link = document.createElement('a');
          link.href = obj.image;
          link.download = 'anim.gif'; 
          link.click();
        }
      });
    }
  </script>
</body>
</html>
